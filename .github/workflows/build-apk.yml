name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          git clone https://github.com/Tonihj77-T/pwa2apk.git
          cd pwa2apk && npm install
      - run: |
          node pwa2apk/bin/pwa2apk.js \
            --url https://username.github.io/Renco-Capital \
            --name "Renco Capital" \
            --package com.renco.capital \
            --output ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: Koperasi Renco 
          path: ./dist/*.apk
